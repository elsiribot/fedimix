[workspace]
resolver = "3"
members = ["crates/fedimix-core", "crates/fedimix-gtk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
gtk = { version = "0.11.5", package = "gtk4" }

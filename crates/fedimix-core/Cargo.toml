[package]
name = "fedimix-core"
description = "Fedimix core logic (no UI dependencies)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
async-channel.workspace = true
async-trait.workspace = true
bitcoin.workspace = true
fedimint-api-client.workspace = true
fedimint-bip39.workspace = true
fedimint-client.workspace = true
fedimint-connectors.workspace = true
fedimint-core.workspace = true
fedimint-eventlog.workspace = true
fedimint-lnv2-client.workspace = true
fedimint-lnv2-common.workspace = true
fedimint-mint-client.workspace = true
fedimint-mintv2-client.workspace = true
fedimint-rocksdb.workspace = true
fedimint-wallet-client.workspace = true
fedimint-wallet-common.workspace = true
fedimint-walletv2-client.workspace = true
fedimint-walletv2-common.workspace = true
futures.workspace = true
lightning-invoice.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[features]
# The scripted federation, for this crate's tests. Only the self dev-dependency
# below turns it on, so no normal build has it.
testing = []

[dev-dependencies]
fedimix-core = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
